name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Remove any old Android/iOS folders
        run: |
          rm -rf android ios

      - name: Create fresh Android and iOS folders
        run: flutter create --platforms=android,ios .

      - name: Clean and get packages
        run: |
          flutter clean
          flutter pub get

      - name: Fix image_gallery_saver namespace
        run: |
          GRADLE_FILE=$(find /home/runner/.pub-cache -path "*/image_gallery_saver/android/build.gradle" 2>/dev/null | head -1)
          if [ -n "$GRADLE_FILE" ]; then
            sed -i 's/android {/android {\n    namespace "com.example.image_gallery_saver"/' "$GRADLE_FILE"
            echo "Namespace added to $GRADLE_FILE"
          else
            echo "image_gallery_saver build.gradle not found, skipping."
          fi

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
