name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Create Android and iOS folders
        run: flutter create --platforms=android,ios .

      - name: Overwrite Android build files with our fixed versions
        run: |
          cp -f android/app/build.gradle android/app/build.gradle.backup
          cp -f android/build.gradle android/build.gradle.backup
          cp -f android/settings.gradle android/settings.gradle.backup
          cp -f android/gradle.properties android/gradle.properties.backup
          echo "Backups created. Our files will now be used."

      - name: Clean and get packages
        run: |
          flutter clean
          flutter pub cache clean
          flutter pub get

      - name: Fix image_gallery_saver namespace (safety)
        run: |
          GRADLE_FILE=$(find /home/runner/.pub-cache -path "*/image_gallery_saver/android/build.gradle" | head -1)
          if [ -f "$GRADLE_FILE" ]; then
            sed -i '/android {/a\    namespace "com.example.image_gallery_saver"' "$GRADLE_FILE"
            echo "Namespace added to $GRADLE_FILE"
          fi

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
