name: Deploy Flutter Web to Firebase Hosting

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود من المستودع
        uses: actions/checkout@v3

      - name: تجهيز بيئة فلاتر
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: تنظيف بيئة العمل
        run: flutter clean

      - name: تحميل المكاتب والإضافات
        run: flutter pub get

      - name: تفعيل دعم الويب
        run: flutter create . --platforms web

      - name: بناء نسخة الويب
        run: flutter build web --release

      # 👈 هذا الجزء الجديد الذي تم تعديله ليرفع مباشرة إلى روابط فايربيس الخاصة بك
      - name: النشر على سيرفرات فايربيس هوسيتنج
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: 'netcardsapp'
